evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # Alice's first denial creates the series before the first scrape.
      - series: 'yt_task_proxy_user_requests_total{user="alice",cache="miss",auth_result="permission_denied"}'
        values: '1 1 1 1'
      # Bob's denial increments a counter that Prometheus has already scraped.
      - series: 'yt_task_proxy_user_requests_total{user="bob",cache="miss",auth_result="permission_denied"}'
        values: '0 0 1 1'
    promql_expr_test:
      - expr: yt_task_proxy_user_requests_total{user="alice",cache="miss",auth_result="permission_denied"}
        eval_time: 3m
        exp_samples:
          - labels: 'yt_task_proxy_user_requests_total{auth_result="permission_denied",cache="miss",user="alice"}'
            value: 1
      - expr: sum by (cache, auth_result) (increase(yt_task_proxy_user_requests_total{user="alice",auth_result!="allowed"}[1h]))
        eval_time: 3m
        exp_samples:
          - labels: '{auth_result="permission_denied",cache="miss"}'
            value: 0
      - expr: sum by (cache, auth_result) (increase(yt_task_proxy_user_requests_total{user="bob",auth_result!="allowed"}[1h]))
        eval_time: 3m
        exp_samples:
          - labels: '{auth_result="permission_denied",cache="miss"}'
            value: 1
