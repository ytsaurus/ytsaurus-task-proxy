name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without the release/ prefix
        required: true
        type: string
  push:
    tags:
      - 'release/0.*.*'

jobs:
  release:
    name: Run release
    uses: ./.github/workflows/subflow_release.yaml
    secrets: inherit
    with:
      release_version: ${{ inputs.release_version || github.ref_name }}
