  name: {{ .Release.Name }}-headless
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: task-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - name: grpc
    port: 9090
    targetPort: 9090
