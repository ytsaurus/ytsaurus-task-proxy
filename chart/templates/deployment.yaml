apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ .Release.Name }}-headless
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
  - metadata:
      name: logs
    spec:
      accessModes: {{ toJson .Values.persistence.accessModes }}
      {{- if ne .Values.persistence.storageClass nil }}
      storageClassName: {{ .Values.persistence.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size | quote }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: task-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: task-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: envoy
        image: {{ .Values.proxy.image.repository }}{{ if .Values.proxy.image.tag }}:{{ .Values.proxy.image.tag }}{{ end }}
        args:
        - "-c"
        - "/etc/envoy/envoy.yaml"
        - "--service-cluster"
        - "edge-proxy"
        - "--log-level"
        - {{ .Values.proxy.logging.minLogLevel | quote }}
        {{- if ne .Values.proxy.logging.writerType "stderr" }}
        - "--log-path"
        - {{ if eq .Values.proxy.logging.writerType "stdout" }}"/dev/stdout"{{ else }}"/var/log/task-proxy/envoy.log"{{ end }}
        {{- end }}
        ports:
        - name: http
          containerPort: 8080
        - name: admin
          containerPort: 9901
        readinessProbe:
          httpGet:
            path: /ready
            port: 9901
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /server_info
            port: 9901
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        - name: logs
          mountPath: /var/log/task-proxy
        {{- if .Values.tls.enabled }}
        - name: cert
          mountPath: /etc/certs
        {{- end }}
        {{- with .Values.proxy.resources }}
        resources:
          {{ toYaml . | nindent 10 }}
        {{- end }}
      - name: server
        image: {{ .Values.server.image.repository }}{{ if .Values.server.image.tag }}:{{ .Values.server.image.tag }}{{ end }}
        command: ["./server"]
        args:
        - "-logging-config=/etc/task-proxy/logging.yaml"
        - "-yt-token-path=/etc/yt/token" 
        - "-yt-proxy={{ default (printf "http-proxies.%s.svc.cluster.local" .Release.Namespace) .Values.ytProxy }}"
        - "-base-domain={{ .Values.baseDomain }}"
        - "-dir-path={{ .Values.dirPath }}"
        - "-discovery-period-seconds={{ .Values.discoveryPeriodSeconds }}"
        - "-connect-timeout-seconds={{ .Values.timeouts.connectTimeoutSeconds }}"
        - "-route-timeout-seconds={{ .Values.timeouts.routeTimeoutSeconds }}"
        - "-stream-idle-timeout-seconds={{ .Values.timeouts.streamIdleTimeoutSeconds }}"
        - "-auth-enabled={{ .Values.auth.enabled }}"
        - "-auth-cookie-name={{ .Values.auth.cookieName }}"
        - "-auth-cache-enabled={{ .Values.auth.cache.enabled }}"
        - "-auth-cache-ttl-seconds={{ .Values.auth.cache.ttlSeconds }}"
        - "-auth-cache-capacity={{ .Values.auth.cache.capacity }}"
        - "-auth-cache-max-concurrent-backend-requests={{ .Values.auth.cache.maxConcurrentBackendRequests }}"
        - "-auth-cache-refresh-before-seconds={{ .Values.auth.cache.refreshBeforeSeconds }}"
        ports:
        - containerPort: 9090
          name: grpc
        - containerPort: 9102
          name: metrics
        volumeMounts:
        - name: token
          mountPath: /etc/yt
        - name: logging-config
          mountPath: /etc/task-proxy
        - name: logs
          mountPath: /var/log/task-proxy
        {{- with .Values.server.resources }}
        resources:
          {{ toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: envoy-config
        configMap:
          name: {{ .Release.Name }}-config
          items:
          - key: envoy.yaml
            path: envoy.yaml
      - name: logging-config
        configMap:
          name: {{ .Release.Name }}-config
          items:
          - key: logging.yaml
            path: logging.yaml
      - name: token
        secret:
          secretName: {{ .Values.tokenSecretRef }}
      {{- if .Values.tls.enabled }}
      - name: cert
        secret:
          secretName: {{ .Values.tls.certSecretRef }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{ toYaml . | nindent 8 }}
      {{- end }}
